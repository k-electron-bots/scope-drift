<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#07131b"><title>Scope Drift | One-thumb sniper</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="shell"><header><div class="brand"><span class="brand-mark">◈</span> SCOPE<span>DRIFT</span></div><div class="badge">FIELD OPS / 08</div></header>
<section class="game-wrap" aria-label="Scope Drift game"><canvas id="game" aria-label="Sniper game playfield"></canvas><div class="top-hud"><div><small>MISSION <span id="mission">01 / 08</span></small><strong id="mission-name">WARM-UP</strong></div><div class="right"><small>RANGE</small><strong id="range">120 M</strong></div></div>
<div class="bottom-hud"><div><small>WIND</small><strong id="wind">CALM</strong></div><div class="shot-status"><small>ROUNDS</small><strong id="shots">● ● ●</strong></div></div>
<div class="overlay" id="overlay"><div class="overline" id="overlay-tag">PRECISION / TIMING / WIND</div><h1 id="overlay-title">ONE SHOT<br><em>AHEAD.</em></h1><p id="overlay-copy">Hold to steady your scope. Drag to aim. Release to fire. Lead moving targets and aim into the wind.</p><button id="action">BEGIN MISSION <span>↗</span></button><div class="hint">8 MISSIONS · 3 ROUNDS EACH · NO TIMER</div></div>
<div class="feedback" id="feedback" aria-live="polite"></div></section><footer><span>HOLD · DRAG · RELEASE</span><span id="progress">01 — 08</span></footer></main><script type="module" src="./js/game.js"></script></body></html>
